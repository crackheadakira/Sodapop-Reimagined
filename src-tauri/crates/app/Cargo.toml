[package]
name = "veil"
version = "0.0.0"
edition = "2024"

[lints]
workspace = true

[build-dependencies]
dotenvy = "0.15.7"

[dependencies]
anyhow.workspace = true
dirs = "6.0.0"
discord-rich-presence = "1.0.0"
dotenvy = "0.15.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.49.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
webbrowser = { version = "1.0.6", features = ["hardened", "disable-wsl"] }
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
] }

gpui = { workspace = true }
gpui_transitions = { workspace = true }
unicode-segmentation = "1.12.0"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
smallvec = "1.15.1"
rust-embed = "8.11.0"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }

common = { workspace = true, features = ["serialization"] }
db.workspace = true
lastfm.workspace = true
media_controls = { workspace = true, features = ["serialization"] }
metadata_audio.workspace = true
logging.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
